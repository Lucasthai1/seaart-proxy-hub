version: '3.9'
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8788:8788"
    env_file:
      - ../api/.env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seaart_proxy
      POSTGRES_USER: seaart
      POSTGRES_PASSWORD: seaart
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
